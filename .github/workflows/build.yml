name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .build/sphinx-core
          key: sphinx-core-${{ hashFiles('Vendor/sphinxrs.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/repositories
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-
      - run: xcodebuild -version && swift --version
      - run: ./scripts/build-ffi.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: swift build --build-tests
      - run: swift test --skip-build

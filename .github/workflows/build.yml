name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .build/sphinx-core
          key: sphinx-core-${{ hashFiles('Vendor/sphinxrs.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/repositories
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-
      - run: xcodebuild -version && swift --version
      - run: ./scripts/build-ffi.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # TEMPORARY diagnostics: failing lines surface as public error annotations. Revert.
      - name: build and test
        shell: bash
        run: |
          set +e
          swift build --build-tests > /tmp/build.log 2>&1; b=$?
          if [ $b -ne 0 ]; then grep -E "error:" /tmp/build.log | sort -u | head -15 | while IFS= read -r l; do l="${l//'%'/%25}"; l="${l//$'\r'/%0D}"; echo "::error title=swift build::${l:0:900}"; done; echo "::error title=swift build::exit code $b"; exit 1; fi
          swift test --skip-build > /tmp/test.log 2>&1; t=$?
          if [ $t -ne 0 ]; then grep -E "error:|Issue|✘|failed|Fatal|SQL" /tmp/test.log | sort -u | head -25 | while IFS= read -r l; do l="${l//'%'/%25}"; l="${l//$'\r'/%0D}"; echo "::error title=swift test::${l:0:900}"; done; echo "::error title=swift test::exit code $t"; exit 1; fi
      # The Mac app, which `swift build` no longer builds (Apps/Peel.xcodeproj).
      - run: >
          xcodebuild -project Apps/Peel.xcodeproj -scheme "Peel macOS" -destination 'platform=macOS'
          -derivedDataPath .build/xcode -quiet CODE_SIGNING_ALLOWED=NO build
